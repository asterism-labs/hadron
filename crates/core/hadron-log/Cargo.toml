[package]
name = "hadron-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Structured logging subsystem for the Hadron kernel"

[lib]
bench = false
doctest = false

[dependencies]
hadron-core = { workspace = true }
hadron-linkset = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(hadron_log_max_level, values(any()))',
]

[lints.clippy]
all = "warn"
pedantic = "warn"
