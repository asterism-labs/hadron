[package]
name = "hadron-sched"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false
doctest = false

[dependencies]
hadron-core = { workspace = true }
planck-noalloc = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(kani)', 'cfg(shuttle)']

[dev-dependencies]
shuttle = "0.8"

[lints.clippy]
all = "warn"
pedantic = "warn"
