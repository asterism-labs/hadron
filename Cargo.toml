[workspace]
resolver = "2"
members = [ "crates/*/*" ]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = [ "hxyulin" ]
repository = "https://github.com/asterism-labs/hadron"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[workspace.dependencies]
# Internal crates
acpi = { path = "crates/parse/acpi" }
arch-x86_64 = { path = "crates/arch/x86_64" }
dwarf = { path = "crates/parse/dwarf" }
elf = { path = "crates/parse/elf" }
fdt = { path = "crates/parse/fdt" }
ktest = { path = "crates/kernel/ktest" }
limine = { path = "crates/boot/limine" }
linkset = { path = "crates/core/linkset" }
mm = { path = "crates/kernel/mm" }
uefi = { path = "crates/boot/uefi" }

# External dependencies
bitflags = "2"
zerocopy = { version = "0.8", features = [ "derive" ] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
