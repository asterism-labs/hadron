[workspace]
resolver = "2"
members = [ "crates/*/*" ]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = [ "hxyulin" ]
repository = "https://github.com/asterism-labs/hadron"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[workspace.dependencies]
# Internal crates
acpi = { path = "crates/parse/acpi" }
binparse = { path = "crates/parse/binparse" }
binparse-macros = { path = "crates/parse/binparse-macros" }
dwarf = { path = "crates/parse/dwarf" }
elf = { path = "crates/parse/elf" }
fdt = { path = "crates/parse/fdt" }
limine = { path = "crates/boot/limine" }
linkset = { path = "crates/core/linkset" }
uefi = { path = "crates/boot/uefi" }

# External dependencies
bitflags = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = [ "full", "extra-traits" ] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
