[workspace]
resolver = "2"
members = [
    "crates/*/*",
    "kernel/*",
]
exclude = [ "userspace", "kernel/boot" ]
default-members = [
    "crates/*/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = [ "hxyulin" ]
repository = "https://github.com/hxyulin/hadron"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[workspace.dependencies]
# Internal crates — core
hadron-core = { path = "kernel/core" }
hadron-intrinsics = { path = "kernel/intrinsics" }
hadron-linkset = { path = "crates/core/linkset" }

# Internal crates — kernel subsystems
hadron-kernel = { path = "kernel/kernel" }
hadron-kernel-image = { path = "kernel/kernel-image" }
hadron-mm = { path = "kernel/mm" }
hadron-objects = { path = "kernel/objects" }
hadron-pci = { path = "kernel/pci" }
hadron-sched = { path = "kernel/sched" }
hadron-syscall = { path = "kernel/syscall" }
hadron-syscall-macros = { path = "kernel/syscall-macros" }

# Internal crates — MMIO
hadron-mmio = { path = "kernel/mmio" }
hadron-mmio-macros = { path = "kernel/mmio-macros" }

# Internal crates — parsers
hadron-acpi = { path = "crates/parse/acpi" }
hadron-binparse = { path = "crates/parse/binparse" }
hadron-binparse-macros = { path = "crates/parse/binparse-macros" }
hadron-elf = { path = "crates/parse/elf" }

# Internal crates — boot
hadron-boot-info = { path = "crates/boot/boot-info" }
uefi = { path = "crates/boot/uefi" }

# Internal crates — test infrastructure
hadron-bench = { path = "crates/test/hadron-bench", default-features = false }
hadron-ktest = { path = "crates/test/hadron-ktest" }
hadron-ktest-macros = { path = "crates/test/hadron-ktest-macros" }
hadron-test = { path = "crates/test/hadron-test", default-features = false }
hadron-utest = { path = "crates/test/hadron-utest" }

# Internal crates — tools (host-only)
hadron-dwarf = { path = "crates/parse/dwarf" }
hadron-perf = { path = "crates/tools/hadron-perf" }
hadron-runner = { path = "crates/tools/hadron-runner" }

# External dependencies (no_std kernel)
bitflags = "2"
planck-noalloc = { version = "0.1.1", default-features = false }
hadris-cpio = { version = "1.0.1", default-features = false }
hadris-io = { version = "1.0.1", default-features = false }
hadris-iso = { version = "1.0.3", default-features = false }

# External dependencies (proc-macro ecosystem)
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

# External dependencies (host tools)
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
crossterm = "0.28"
flate2 = "1"
ratatui = "0.29"
rhai = { version = "1", features = ["sync"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
inferno = { version = "0.12", default-features = false, features = ["nameattr"] }
rustc-demangle = "0.1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
walkdir = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
# panic = abort is in target spec

[profile.release]
# panic = abort is in target spec

[workspace.metadata.hadron]
default-target = "x86_64-unknown-hadron"
